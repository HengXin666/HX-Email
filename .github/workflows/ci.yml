name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: npm ci --prefix web
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: bash scripts/verify.sh
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.bridge.yml config --quiet
      - name: Build and smoke test bridge deployment
        run: |
          docker compose -f docker-compose.bridge.yml up -d --build
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/healthz
      - name: Tear down deployment
        if: ${{ always() }}
        run: docker compose -f docker-compose.bridge.yml down -v
