# lefthook.yml - git hooks team gate

pre-commit:
  parallel: true
  commands:
    python:
      glob: "*.{py,toml}"
      run: uv run pre-commit run --files {staged_files}
      stage_fixed: true
    biome:
      glob: "web/**/*.{ts,tsx,js,jsx,json}"
      run: bash -c 'cd web && files=("${@/#web\//}") && node_modules/.bin/biome check --write --no-errors-on-unmatched "${files[@]}"' -- {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{md,yml,yaml}"
      run: web/node_modules/.bin/prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    # Agent Notes 门禁 (结构/格式/引用/覆盖率). 复用 skill 自带的 shim, 它自带
    # "原生 Node >=22.6 优先, 否则 npx tsx" 的 runner 回退. 不加 glob: 覆盖率门禁
    # 必须在每次提交都跑, 否则动了受保护源码却不带 note 的提交会被放过去.
    agent-notes:
      run: sh .agents/skills/hx-agent-notes/assets/hooks/pre-commit

pre-push:
  commands:
    verify:
      run: bash scripts/verify.sh
