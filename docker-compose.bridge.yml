# HX-Email 一键部署 (桥接网络版: Mac / Windows Docker Desktop, 或不想用 host 网络时)
#
#   docker compose -f docker-compose.bridge.yml up -d --build
#   打开 http://127.0.0.1:8080  (默认账号 admin / admin)
#
# ⚠️ 代理填写注意: 此模式下容器内的 127.0.0.1 是容器自身, 不是宿主机!
# 系统里的分组代理 / Telegram 代理如果要走宿主机上的 Clash / V2Ray,
# 请填 http://host.docker.internal:7890 (已通过 host-gateway 映射到宿主机)。
# 想直接填 127.0.0.1:7890 的 Linux 用户请改用默认的 docker-compose.yml (host 网络)。

name: hx-email

services:
  backend:
    build: ./server
    restart: unless-stopped
    extra_hosts:
      # 让容器内的 host.docker.internal 指向宿主机 (Linux 上也生效)
      - "host.docker.internal:host-gateway"
    environment:
      HX_EMAIL_DATA_DIR: /data
      HX_EMAIL_ADMIN_USERNAME: ${HX_EMAIL_ADMIN_USERNAME:-admin}
      HX_EMAIL_ADMIN_PASSWORD: ${HX_EMAIL_ADMIN_PASSWORD:-admin}
      HX_EMAIL_SECRET_KEY: ${HX_EMAIL_SECRET_KEY:-}
      # 主从同步 (从机): 指向主实例并携带主实例管理员 Bearer token
      HX_EMAIL_SYNC_URL: ${HX_EMAIL_SYNC_URL:-}
      HX_EMAIL_SYNC_TOKEN: ${HX_EMAIL_SYNC_TOKEN:-}
      HX_EMAIL_SYNC_INTERVAL_SECONDS: ${HX_EMAIL_SYNC_INTERVAL_SECONDS:-300}
      HX_EMAIL_BIND_HOST: 0.0.0.0
      HX_EMAIL_BACKEND_PORT: "18090"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:18090/healthz")
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HX_EMAIL_HTTP_PORT:-8080}:8080"
    environment:
      LISTEN_PORT: "8080"
      API_TARGET: http://backend:18090
